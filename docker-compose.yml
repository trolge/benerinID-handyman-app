version: '3.8'

services:
  # Laravel Web & Worker Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: benerinid-app:latest
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "${APP_NAME:-BenerinID}"
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-benerinid_app}"
      DB_USERNAME: "${DB_USERNAME:-benerinid_user}"
      DB_PASSWORD: "${DB_PASSWORD:-benerinid_password}"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    volumes:
      - app-storage:/var/www/storage
    depends_on:
      - db

  # MySQL Database Service
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-benerinid_app}"
      MYSQL_USER: "${DB_USERNAME:-benerinid_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-benerinid_password}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-benerinid_password}"
    ports:
      - "33060:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  app-storage:
  db-data:
